apiVersion: batch/v1
kind: Job
metadata:
  name: s95-migrate
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s95
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-sion2k-pull
      containers:
        - name: migrate
          image: registry.sion2k.ru/s95/web:latest
          imagePullPolicy: Always
          command: ["/usr/src/app/bin/docker-entrypoint"]
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: s95-env
            - secretRef:
                name: s95-app-secrets
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: s95.s95-db.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: s95.s95-db.credentials.postgresql.acid.zalan.do
                  key: password
          volumeMounts:
            - name: additional-events
              mountPath: /usr/src/app/config/additional_events.yml
              subPath: additional_events.yml
              readOnly: true
      volumes:
        - name: additional-events
          configMap:
            name: s95-additional-events
