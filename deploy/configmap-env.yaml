apiVersion: v1
kind: ConfigMap
metadata:
  name: s95-env
data:
  APP_HOST: s95.sion2k.ru
  TZ: Europe/Moscow
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  PUMA_BIND: tcp://0.0.0.0:3000
  DATABASE_HOST: s95-db
  DATABASE_NAME: s95
  DATABASE_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CABLE_REDIS_URL: redis://redis:6379/1
  MEMCACHE_SERVERS: memcached:11211
  RAILS_PERFORMANCE_ENABLED: "true"
